<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        window.addEventListener("load", function () {

            let editingId = null;
            let dataIndex = 3;
            let data = [
                {
                    "id":0,
                    "title":"오늘 할일",
                    "content":"OSS 과제, 웹서개 과제",
                    "category":"TODO",
                    "createdAt":"2026-10-03"
                },
                {
                    "id":1,
                    "title":"이번 주 약속",
                    "content":"금요일 팀플 회의, 토요일 동아리 모임",
                    "category":"SCHEDULE",
                    "createdAt":"2026-10-01"
                },
                {
                    "id":2,
                    "title":"장보기 목록",
                    "content":"우유, 계란, 식빵, 바나나",
                    "category":"BUY",
                    "createdAt":"2026-09-25"
                }
            ]

            
            let title = document.querySelector("#title");
            let content = document.querySelector("#content");
            let category = document.querySelector("#category");
            let createdAt = document.querySelector("#createdAt");
            let submitBtn = document.querySelector("#submitBtn");

            function addItem() {
                if (title.value.trim() === "") return;
                if (content.value.trim() === "") return;
                if (category.value.trim() === "") return;
                if (createdAt.value === "") return;

                if (editingId === null) {
                    data.push({
                        id: dataIndex,
                        title: title.value.trim(),
                        content: content.value.trim(),
                        category: category.value.trim(),
                        createdAt: createdAt.value
                    })
                    dataIndex += 1;
                } else {
                    let target = data.find((d) => d.id === editingId);

                    target.title = title.value.trim();
                    target.content = content.value.trim();
                    target.category = category.value.trim();
                    target.createdAt = createdAt.value.trim();

                    editingId = null;
                }

                title.value = "";
                content.value = "";
                category.value = "";
                createdAt.value = "";
                
                render();
            }

            function update(item) {
                title.value = item.title;
                content.value = item.content;
                category.value = item.category;
                createdAt.value = item.createdAt;

                editingId = item.id;
            }

            function render() {

                list.replaceChildren();

                data.forEach((item) => {
                    let li = document.createElement("li");
                    let span = document.createElement("span");
                    let updateBtn = document.createElement("button");
                    let deleteBtn = document.createElement("button");

                    span.innerText = item.id+" | "+item.title+" | "+item.content+" | "+item.category+" | "+item.createdAt+" | ";
                    updateBtn.innerText = "수정";
                    deleteBtn.innerText = "삭제";

                    updateBtn.addEventListener("click", () => update(item));

                    li.appendChild(span);
                    li.appendChild(updateBtn);
                    li.appendChild(deleteBtn);

                    list.appendChild(li);
                })
            }

            render();

            submitBtn.addEventListener("click", addItem);

        })
    </script>
</head>
<body>

    <form>
        <span>제목</span>
        <input id="title" type="text">
        <br>
        <span>본문</span>
        <input id="content" type="text">
        <br>
        <span>카테고리</span>
        <input id="category" type="text">
        <br>
        <span>생성일</span>
        <input id="createdAt" type="date">
        <br>
        <button id="submitBtn" type="button">추가</button>
    </form>

    <p>--------------------------------------------</p>

    <p style="white-space: pre">ID   제목      본문                카테고리      생성일</p>

    <ul id="list"></ul>
</body>
</html>
